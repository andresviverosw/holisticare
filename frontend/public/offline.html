<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2d9b5f" />
    <title>HolistiCare — Sin conexión</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #2d9b5f;
        --bg: #f8f9fa;
        --text: #212529;
        --muted: #495057;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: linear-gradient(160deg, #f0faf4 0%, var(--bg) 55%, #e9ecef 100%);
        color: var(--text);
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
        color: var(--brand);
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: var(--muted);
      }
      button {
        margin-top: 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 0.65rem 1.1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HolistiCare</h1>
      <p id="offline-message">
        Sin conexión o servicio no disponible. Revisa tu red e intenta de nuevo. La sesión se
        mantiene si ya iniciaste sesión.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
